name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/vast-qtc-xtm-idle
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - uses: docker/metadata-action@v5
        id: meta_peak2080
        with:
          images: ghcr.io/${{ github.repository_owner }}/vast-qtc-xtm-idle
          tags: |
            type=raw,value=peak2080
            type=sha,prefix=peak2080-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.peak2080
          push: true
          tags: ${{ steps.meta_peak2080.outputs.tags }}
          labels: ${{ steps.meta_peak2080.outputs.labels }}
          platforms: linux/amd64
